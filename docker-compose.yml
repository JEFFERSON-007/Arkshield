version: '3.8'

services:
  arkshield-api:
    image: python:3.10-slim
    container_name: arkshield-api
    working_dir: /app
    volumes:
      - .:/app
    environment:
      - ARKSHIELD_API_KEY=arkshield-dev-key-2026
      - PYTHONUNBUFFERED=1
    ports:
      - "8000:8000"
    command: >
      bash -c "pip install -r requirements.txt &&
      python -m uvicorn src.arkshield.api.server:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped
